<svg viewBox="0 0 970 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>Two Node-RED runtimes facing each other: the frontend sends intent, the backend returns a display-ready view-model and keeps records in a SQL database.</title><text x="40" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">FRONTEND AND BACKEND, TWO INSTANCES, ONE CONTRACT</text><rect x="40" y="86" width="220" height="72" rx="11" fill="#eef2ff" stroke="#5048e5" stroke-width="2.5"/><text x="150" y="121" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">Node-RED</text><text x="150" y="139" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.72">(runtime)</text><rect x="94" y="75" width="112" height="22" rx="11" fill="#ffffff" stroke="#5048e5" stroke-width="1.4"/><text x="150" y="90" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5048e5">renders + emits</text><rect x="480" y="86" width="220" height="72" rx="11" fill="#eef2ff" stroke="#5048e5" stroke-width="2.5"/><text x="590" y="121" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">Node-RED</text><text x="590" y="139" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.72">(runtime)</text><rect x="534" y="75" width="112" height="22" rx="11" fill="#ffffff" stroke="#5048e5" stroke-width="1.4"/><text x="590" y="90" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#5048e5">holds the truth</text><line x1="260" y1="110" x2="480" y2="110" stroke="#9ca3af" stroke-width="2.2"/><polygon points="471.0,115.0 480,110 471.0,105.0" fill="#9ca3af"/><rect x="281.3" y="92" width="177.4" height="15" fill="#f8fbff" opacity="0.92"/><text x="370" y="102" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">intent (what the user wants)</text><line x1="480" y1="140" x2="260" y2="140" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="6,4"/><polygon points="269.0,135.0 260,140 269.0,145.0" fill="#9ca3af"/><rect x="269.2" y="148" width="201.6" height="15" fill="#f8fbff" opacity="0.92"/><text x="370" y="158" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">view-model (display-ready state)</text><line x1="700" y1="122" x2="762" y2="122" stroke="#9ca3af" stroke-width="2.2"/><polygon points="753.0,127.0 762,122 753.0,117.0" fill="#9ca3af"/><path d="M764,95 a88,11 0 0 1 176,0 v54 a88,11 0 0 1 -176,0 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><path d="M764,95 a88,11 0 0 0 176,0" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="852" y="124" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14532d">SQL database</text><text x="852" y="141" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#14532d" opacity="0.72">records</text></svg>
