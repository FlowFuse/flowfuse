<svg role="img" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><title>Three stacked bands: a Full deploy restarts every tab and drops all connections, Modified Flows restarts only the changed tab, and Modified Nodes restarts only the changed node so open connections survive.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="arrowSlate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arrowPurple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="24" y="22" width="852" height="78" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="8,5"/>
<rect x="30" y="7" width="11" height="11" rx="2.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="47" y="16" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#b91c1c">Full — restarts the whole runtime (all tabs, all connections drop)</text><rect x="24" y="116" width="852" height="78" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" stroke-dasharray="8,5"/>
<rect x="30" y="101" width="11" height="11" rx="2.5" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="47" y="110" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#b45309">Modified Flows — restarts only tabs you changed</text><rect x="24" y="210" width="852" height="78" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="8,5"/>
<rect x="30" y="195" width="11" height="11" rx="2.5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
<text x="47" y="204" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#15803d">Modified Nodes — restarts only the nodes you changed (default; least disruptive)</text><g>
<rect x="90" y="48" width="150" height="40" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
<text x="165" y="73" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">tab A</text>

</g><g>
<rect x="270" y="48" width="150" height="40" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
<text x="345" y="73" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">tab B</text>

</g><g>
<rect x="450" y="48" width="150" height="40" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
<text x="525" y="73" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">connections</text>

</g><g>
<rect x="90" y="142" width="150" height="40" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
<text x="165" y="167" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">changed tab</text>

</g><g>
<rect x="90" y="236" width="150" height="40" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
<text x="165" y="261" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2937">changed node</text>

</g><text x="640" y="166" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">unchanged tabs keep running</text><text x="640" y="260" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">open connections survive</text></svg>
