<svg viewBox="0 0 720 310" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>An event reaches a node that recomputes and writes to the context store, while a second node reads back only the one key it needs.</title><text x="46" y="28" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">MESSAGES ARE VERBS, CONTEXT IS NOUNS</text><rect x="30" y="52" width="660" height="240" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="46" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="116.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text x="676" y="72" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.55">(runtime)</text><rect x="54" y="96" width="150" height="52" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="129" y="119" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">event</text><text x="129" y="135" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">a reading arrived</text><line x1="204" y1="122" x2="238" y2="122" stroke="#9ca3af" stroke-width="2.2"/><polygon points="229.0,127.0 238,122 229.0,117.0" fill="#9ca3af"/><rect x="240" y="96" width="140" height="52" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="310" y="119" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">node</text><text x="310" y="135" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">recompute</text><line x1="380" y1="122" x2="430" y2="122" stroke="#9ca3af" stroke-width="2.2"/><polygon points="421.0,