<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>One unnamed flow at the top, redrawn below as four named stages: ingest, normalize, enrich and publish.</title><text x="46" y="28" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">NAME THE STAGES HIDING INSIDE ONE INSTANCE</text><rect x="30" y="52" width="700" height="262" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="46" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="116.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text x="716" y="72" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.55">(runtime)</text><rect x="220" y="82" width="320" height="52" rx="9" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,4"/><text x="380" y="108" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7280">one flow, no seams</text><text x="380" y="124" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9ca3af">nothing to reuse or hand off</text><line x1="380" y1="134" x2="380" y2="168" stroke="#9ca3af" stroke-width="2.2"/><polygon points="375.0,159.0 380,168 385.0,159.0" fill="#9ca3af"/><rect x="391.6" y="148" width="92.7" height="15" fill="#f8fbff" opacity="0.92"/><text x="438" y="158" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">draw the boxes</text><rect x="54" y="196" width="148" height="54" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="128" y="227" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Ingest</text><line x1="202" y1="223" x2="220" y2="223" stroke="#9ca3af" stroke-width="2.2"/><polygon points="211.0,228.0 220,223 211.0,218.0" fill="#9ca3af"/><rect x="222" y="196" width="148" height="54" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="296" y="227" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Normalize</text><line x1="370" y1="223" x2="388" y2="223" stroke="#9ca3af" stroke-width="2.2"/><polygon points="379.0,228.0 388,223 379.0,218.0" fill="#9ca3af"/><rect x="390" y="196" width="148" height="54" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="464" y="227" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Enrich</text><line x1="538" y1="223" x2="556" y2="223" stroke="#9ca3af" stroke-width="2.2"/><polygon points="547.0,228.0 556,223 547.0,218.0" fill="#9ca3af"/><rect x="558" y="196" width="148" height="54" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="632" y="227" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Publish</text></svg>
