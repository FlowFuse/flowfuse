<svg viewBox="0 0 780 290" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>PLC signals arriving at Node-RED and then splitting into three separate streams: telemetry, control and config.</title><text x="40" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">SORT DATA BY WHAT IT IS FOR</text><rect x="30" y="104" width="150" height="64" rx="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/><text x="105" y="135" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">PLC</text><text x="105" y="153" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">signals</text><line x1="180" y1="136" x2="218" y2="136" stroke="#9ca3af" stroke-width="2.2"/><polygon points="209.0,141.0 218,136 209.0,131.0" fill="#9ca3af"/><rect x="220" y="103" width="210" height="66" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/><text x="325" y="135" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">Node-RED</text><text x="325" y="153" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">(edge device)</text><path d="M430,136 C465,136 465,70 500,70" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="491,65 500,70 491,75" fill="#9ca3af"/><path d="M430,136 C465,136 465,150 500,150" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="491,145 500,150 491,155" fill="#9ca3af"/><path d="M430,136 C465,136 465,230 500,230" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="491,225 500,230 491,235" fill="#9ca3af"/><rect x="500" y="44" width="250" height="52" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="625" y="67" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Telemetry</text><text x="625" y="83" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">continuous, latency-tolerant</text><rect x="500" y="124" width="250" height="52" rx="9" fill="#fdecec" stroke="#8f0000" stroke-width="2"/><text x="625" y="147" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Control</text><text x="625" y="163" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">small, time-critical</text><rect x="500" y="204" width="250" height="52" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="625" y="227" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Config</text><text x="625" y="243" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">written rarely</text></svg>
