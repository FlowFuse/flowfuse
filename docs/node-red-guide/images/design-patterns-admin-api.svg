<svg viewBox="0 0 780 290" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>Flow JSON handed to the Admin API, which deploys it to a hosted Node-RED runtime and to a Node-RED runtime at the edge.</title><text x="40" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">EMIT JSON, DEPLOY VIA THE ADMIN API</text><rect x="40" y="104" width="170" height="64" rx="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/><text x="125" y="135" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">flow JSON</text><text x="125" y="153" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">you emit it</text><line x1="210" y1="136" x2="258" y2="136" stroke="#9ca3af" stroke-width="2.2"/><polygon points="249.0,141.0 258,136 249.0,131.0" fill="#9ca3af"/><rect x="260" y="104" width="160" height="64" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="340" y="133" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">Admin API</text><text x="340" y="149" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">POST /flows</text><path d="M420,136 C459,136 459,86 498,86" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="489,81 498,86 489,91" fill="#9ca3af"/><path d="M420,136 C459,136 459,196 498,196" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="489,191 498,196 489,201" fill="#9ca3af"/><rect x="500" y="56" width="240" height="60" rx="11" fill="#eef2ff" stroke="#5048e5" stroke-width="2.5"/><text x="620" y="85" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">Node-RED</text><text x="620" y="103" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.72">(runtime)</text><rect x="500" y="166" width="240" height="60" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/><text x="620" y="195" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">Node-RED</text><text x="620" y="213" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">(edge device)</text><text x="390" y="256" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#9ca3af">links populated by node id (not name), l:true, x = LEFT + width/2, respond once on msg.error</text></svg>
