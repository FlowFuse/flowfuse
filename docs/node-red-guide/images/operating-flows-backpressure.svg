</g><text x="560" y="190" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" fill="#94a3b8">LEGEND</text><line x1="560" y1="201" x2="576" y2="201" stroke="#7c3aed" stroke-width="2" stroke-dasharray="2,4"/><text x="584" y="204" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#374151">fast in</text><line x1="560" y1="221" x2="576" y2="221" stroke="#9ca3af" stroke-width="2"/><text x="584" y="224" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#374151">paced out</text><text x="390" y="238" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#dc2626">No pacing here → the queue grows and the heap blows.</text></svg>
