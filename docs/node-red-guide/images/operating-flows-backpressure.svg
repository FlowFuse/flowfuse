<svg role="img" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><title>A fast, bursty MQTT input feeding a rate limit or batch step, which passes a steady rate on to a slow database write that is the bottleneck.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="arrowSlate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrowOrange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="arrowPurple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="24" y="26" width="852" height="210" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="8,5"/>
<rect x="30" y="11" width="11" height="11" rx="2.5" fill="#fff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="47" y="20" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#64748b">Node-RED runtime</text><path d="M234.0,128.0 C274.8,128.0 261.2,128.0 302.0,128.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="2,4" marker-end="url(#arrowPurple)"/><rect x="228" y="119" width="78" height="17" rx="4" fill="#ffffff" opacity="0.92"/><text x="267" y="131" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">many msg/s</text><path d="M480.0,128.0 C529.2,128.0 512.8,125.0 562.0,125.0" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/><rect x="480.1" y="117.5" width="84.8" height="17" rx="4" fill="#ffffff" opacity="0.92"/><text x="522.5" y="129.5" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">steady rate</text><g>
<rect x="54" y="96" width="180" height="64" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
<circle cx="144" cy="113" r="2.3" fill="#374151"/><circle cx="144" cy="106" r="1.6" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="144" cy="120" r="1.6" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="137" cy="113" r="1.6" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="151" cy="113" r="1.6" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M144,110.7 v-3 M144,115.3 v3 M141.7,113 h-3 M146.3,113 h3" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="144" y="132" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">MQTT in</text>
<text x="144" y="147" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">fast · bursty</text>
</g><g>
