<circle cx="390" cy="113" r="3.4" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M390,106 v2.4 M390,117.6 v2.4 M383,113 h2.4 M394.6,113 h2.4 M385,108 l1.7,1.7 M393.3,116.3 l1.7,1.7 M395,108 l-1.7,1.7 M386.7,116.3 l-1.7,1.7" stroke="#374151" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
