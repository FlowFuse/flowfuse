<svg role="img" viewBox="0 0 790 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><title>Two runtimes side by side: one holding a single tangled flow, the other holding four named tabs for Config, Ingestion, Processing and Presentation with arrows between them.</title><text x="40" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">ONE TAB, EVERYTHING</text><text x="400" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">FOUR NAMED TABS</text><rect x="30" y="52" width="300" height="222" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="46" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="116.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text x="316" y="72" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.55">(runtime)</text><path d="M70,120 C130,90 180,180 240,120 C200,170 260,210 120,220 C90,180 60,200 70,120 Z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,4"/><text x="178" y="168" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6b7280">one flow</text><text x="178" y="185" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9ca3af">everything tangled</text><rect x="380" y="52" width="380" height="222" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="396" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="466.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text