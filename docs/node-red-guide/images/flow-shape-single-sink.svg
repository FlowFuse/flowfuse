<svg role="img" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><title>Two read paths and one write path converging on a single labeled link out that feeds one http response node.</title><text x="46" y="28" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">MANY PATHS, ONE SINK, NO DECISIONS HERE</text><rect x="30" y="52" width="660" height="252" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="46" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="116.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text x="676" y="72" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.55">(runtime)</text><rect x="56" y="88" width="160" height="48" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="136" y="116" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">path, read</text><path d="M216,112 C258,112 258,186 300,186" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="291,181 300,186 291,191" fill="#9ca3af"/><rect x="56" y="162" width="160" height="48" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="136" y="190" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">path, read</text><path d="M216,186 C258,186 258,186 300,186" fill="none" stroke="#9ca3af" stroke-width="2.2"/><polygon points="291,181 300,186 291,191" fill="#9ca3af"/><rect x="56" y="236" width="160" height="48" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="136" y="264" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#37415