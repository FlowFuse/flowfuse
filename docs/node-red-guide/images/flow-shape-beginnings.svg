<svg role="img" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><title>Three beginnings inside one Node-RED runtime, each running left to right through its own prep step to its own sink.</title><text x="46" y="28" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">THREE BEGINNINGS, THREE PATHS</text><rect x="30" y="52" width="650" height="252" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="46" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="116.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text x="666" y="72" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.55">(runtime)</text><rect x="56" y="86" width="160" height="52" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="136" y="109" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">http in</text><text x="136" y="125" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">a request arrives</text><line x1="216" y1="112" x2="254" y2="112" stroke="#9ca3af" stroke-width="2.2"/><polygon points="245.0,117.0 254,112 245.0,107.0" fill="#9ca3af"/><rect x="256" y="86" width="150" height="52" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="331" y="116" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">prep + format</text><line x1="406" y1="112" x2="444" y2="112" stroke="#9ca3af" stroke-width="2.2"/><polygon points="435.0,117.0 444,112 435.0,107.0" fill="#9ca3af"/><rect x="446" y="86" width="120" height="52" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><tex