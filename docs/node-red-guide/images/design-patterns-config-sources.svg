<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>Two halves: on the left an environment variable baked in at deploy, on the right UI edits writing live config into the context store that the flow reads while running.</title><text x="40" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">ENV VAR, SET AT DEPLOY</text><text x="430" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#16a34a">PERSISTED CONTEXT, CHANGED BY A USER</text><line x1="380" y1="44" x2="380" y2="278" stroke="#e5e7eb" stroke-width="1.5"/><rect x="50" y="110" width="220" height="64" rx="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/><text x="160" y="141" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">BROKER_HOST</text><text x="160" y="159" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">baked, read-only</text><text x="160" y="206" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">change it means edit env,</text><text x="160" y="224" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">then redeploy</text><rect x="420" y="90" width="160" height="52" rx="9" fill="#ffffff" stroke="#5048e5" stroke-width="2"/><text x="500" y="113" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">UI edits</text><text x="500" y="129" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">a form or button</text><line x1="500" y1="142" x2="500" y2="176" stroke="#9ca3af" stroke-width="2.2"/><polygon points="495.0,167.0 500,176 505.0,167.0" fill="#9ca3af"/><rect x="515.9" y="154" width="44.3" height="15" fill="#f8fbff" opacity="0.92"/><text x="538" y="164" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">intent</text><path d="M408,180 a92,11 0 0 1 184,0 v50 a92,11 0 0 1 -184,0 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><path d="M408,180 a92,11 0 0 0 184,0" fill="none" stroke="#16a34a" stroke-width="2.5"/><text x="500" y="207" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14532d">context store</text><text x="500" y="224" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#14532d" opacity="0.72">live config</text><line x1="592" y1="205" x2="650" y2="205" stroke="#9ca3af" stroke-width="2.2"/><polygon points="641.0,210.0 650,205 641.0,200.0" fill="#9ca3af"/><rect x="650" y="180" width="120" height="52" rx="9" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="710" y="203" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">flow at run</text><text x="710" y="219" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280">reads current</text></svg>
