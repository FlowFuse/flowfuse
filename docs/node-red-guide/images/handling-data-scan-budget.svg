<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>A PLC's single per-scan budget shared between control logic, I/O and comms, with Node-RED polling across the comms slice.</title><text x="40" y="26" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">EVERY POLL SPENDS THE CONTROLLER SCAN BUDGET</text><rect x="40" y="72" width="300" height="120" rx="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/><text x="190" y="98" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#374151">PLC</text><text x="190" y="115" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">one scan budget</text><rect x="60" y="140" width="120" height="34" rx="6" fill="#9ca3af"/><text x="120" y="161" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">control logic</text><rect x="180" y="140" width="60" height="34" rx="6" fill="#d1d5db"/><text x="210" y="161" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">I/O</text><rect x="240" y="140" width="80" height="34" rx="6" fill="#6b7280"/><text x="280" y="161" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff">comms</text><rect x="430" y="105" width="220" height="66" rx="11" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/><text x="540" y="137" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2937">Node-RED</text><text x="540" y="155" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">(edge device)</text><line x1="430" y1="148" x2="342" y2="148" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="6,4"/><polygon points="351.0,143.0 342,148 351.0,153.0" fill="#9ca3af"/><rect x="368.9" y="130" width="38.3" height="15" fill="#f8fbff" opacity="0.92"/><text x="388" y="140" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280">polls</text><text x="540" y="196" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#9ca3af">poll only what needs the rate</text></svg>
