<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img"><title>Four rungs climbing left to right, from link in and out, to link call, to subflow, to palette node, with cost rising at each step.</title><text x="46" y="28" text-anchor="start" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#9ca3af">PICK THE LOWEST RUNG THAT SOLVES IT</text><rect x="30" y="52" width="700" height="262" rx="14" fill="#f8fbff" stroke="#5048e5" stroke-width="2"/><rect x="46" y="39" width="141" height="26" rx="8" fill="#eef2ff" stroke="#5048e5" stroke-width="2"/><text x="116.5" y="56" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2937">Node-RED</text><text x="716" y="72" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#1f2937" opacity="0.55">(runtime)</text><circle cx="72" cy="266" r="13" fill="#0f5b60"/><text x="72" y="271" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text><rect x="54" y="248" width="160" height="56" rx="9" fill="#e0f5f6" stroke="#0f5b60" stroke-width="2"/><text x="144" y="273" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">link in / out</text><text x="144" y="289" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7280">tidiness only</text><line x1="214" y1="256" x2="234" y2="210" stroke="#9ca3af" stroke-width="2.2"/><polygon points="235.0,220.2 234,210 225.8,216.3" fill="#9ca3af"/><circle cx="252" cy="220" r="13" fill="#0f5b60"/><text x="252" y="225" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text><rect x="234" y="202" width="160" height="56" rx="9" fill="#e0f5f6" stroke="#0f5b60" stroke-width="2"/><text x="324" y="227" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">link call</text><text x="324" y="243" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7280">shared, returning service</text><line x1="394" y1="210" x2="414" y2="164" stroke="#9ca3af" stroke-width="2.2"/><polygon points="415.0,174.2 414,164 405.8,170.3" fill="#9ca3af"/><circle cx="432" cy="174" r="13" fill="#0f5b60"/><text x="432" y="179" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text><rect x="414" y="156" width="160" height="56" rx="9" fill="#e0f5f6" stroke="#0f5b60" stroke-width="2"/><text x="504" y="181" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">subflow</text><text x="504" y="197" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7280">per-instance or reuse</text><line x1="574" y1="164" x2="594" y2="118" stroke="#9ca3af" stroke-width="2.2"/><polygon points="595.0,128.2 594,118 585.8,124.3" fill="#9ca3af"/><circle cx="612" cy="128" r="13" fill="#0f5b60"/><text x="612" y="133" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text><rect x="594" y="110" width="160" height="56" rx="9" fill="#e0f5f6" stroke="#0f5b60" stroke-width="2"/><text x="684" y="135" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#374151">palette node</text><text x="684" y="151" text-anchor="middle" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7280">real code, distribution</text><text x="658" y="108" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#9ca3af">cost</text><text x="658" y="122" text-anchor="end" font-family="Heebo,Helvetica,Arial,sans-serif" font-size="11" fill="#9ca3af">rises</text></svg>
