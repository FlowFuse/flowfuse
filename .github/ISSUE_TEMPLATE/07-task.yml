name: 📄 Task
description: Create a task
labels: [task]
body:
- type: markdown
  attributes:
    value: |
      A task is a discrete piece of work that needs doing that doesn't necessarily
      related to a Story or Epic.
- type: textarea
  attributes:
    label: Description
    description: Describe the task
- type: input
  attributes:
    label: Epic/Story
    description: Is this task part of an existing epic or story?
    placeholder: '#123'
- type: dropdown
  id: expert-sync
  attributes:
    label: Does this need to be reflected in the FlowFuse Expert?
    description: New or changed platform capabilities usually need matching Expert work, either MCP tooling so the Expert can drive the feature, or a skill so it knows how to use it. Select everything that applies.
    multiple: true
    options:
      - No Expert impact
      - Needs new MCP tooling
      - Needs existing MCP tooling updated
      - Needs a new skill
      - Needs an existing skill updated
      - Not sure, needs input
  validations:
      required: true
- type: dropdown
  id: estimation
  attributes:
    label: Have you provided an initial effort estimate for this issue?
    description: See our [handbook](https://flowfuse.com/handbook/development/project-management/#sizing-issues) for more details.
    multiple: false
    options:
      - I have provided an initial effort estimate
      - I am not a FlowFuse team member
      - I can not provide an initial effort estimate
  validations:
      required: true
